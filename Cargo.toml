[workspace]
members = ["crates/meridian-core", "crates/meridian-desktop"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.1.0"
publish = false
license-file = "LICENSE"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
