name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux window dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libx11-dev libwayland-dev pkg-config
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -B -m unittest discover -s tools -p 'test_*.py' -v

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npx --yes markdownlint-cli2@0.22.1 '**/*.md'

  coverage:
    name: Coverage reports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Linux window dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libx11-dev libwayland-dev pkg-config
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component llvm-tools-preview --component clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: coverage
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Rust coverage and Clippy report
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --locked --lcov --output-path coverage/lcov.info
          cargo clippy --workspace --all-targets --locked --message-format=json -- -D warnings > coverage/clippy.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Python coverage
        run: |
          python -m pip install coverage==7.17.3
          python -m coverage run -m unittest discover -s tools -p 'test_*.py' -v
          python -m coverage xml -o coverage/python.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: coverage/
          if-no-files-found: error

  sonar:
    name: SonarQube (main)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [rust, docs, coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage-reports
          path: coverage/
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Verify effective Sonar new-code policy
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          python3 - <<'PYTHON'
          import base64, json, os, urllib.request
          token = os.environ['SONAR_TOKEN']
          if not token:
              raise SystemExit('SONAR_TOKEN is required for main analysis')
          url = 'https://sonarcloud.io/api/settings/values?component=stephenlclarke_Meridian&keys=sonar.leak.period'
          authorization = base64.b64encode((token + ':').encode()).decode()
          request = urllib.request.Request(url, headers={'Authorization': 'Basic ' + authorization})
          with urllib.request.urlopen(request, timeout=30) as response:
              settings = json.load(response)['settings']
          if not any(item['key'] == 'sonar.leak.period' and item.get('value') == 'previous_version' for item in settings):
              raise SystemExit('Sonar new-code policy must be Previous version')
          print('Verified: Previous version')
          PYTHON
      - uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectVersion=${{ github.sha }}
            -Dsonar.scm.revision=${{ github.sha }}
            -Dsonar.qualitygate.wait=true
